<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Worker</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<link rel="stylesheet" href="../css/worker.css">


</head>


<body>



<div class="dashboard-container">



<!-- Sidebar -->


<div class="sidebar">


<div class="logo">

🌾 AI Smart<br>
Farming

</div>




<ul>


<li>

<i class="bi bi-grid-fill"></i>

Dashboard

</li>


<li>

<i class="bi bi-person-circle"></i>

Profile

</li>


<li>

<i class="bi bi-map"></i>

Land

</li>


<li>

<i class="bi bi-tree-fill"></i>

Crops

</li>



<li>

<i class="bi bi-wallet-fill"></i>

Expenses

</li>



<li class="active">

<i class="bi bi-people-fill"></i>

Workers

</li>



<li>

<i class="bi bi-cart-fill"></i>

Sales

</li>



</ul>



</div>







<!-- Main Content -->


<div class="main-content">



<div class="topbar">


<h2>

➕ Add Worker

</h2>



<div>

🔔

<b>
Welcome, Shubham
</b>

👤

</div>


</div>







<div class="content">



<div class="form-card">



<h3>

Add New Worker

</h3>




<form>



<div class="row g-4">



<!-- Name -->

<div class="col-md-6">


<label>
Worker Name
</label>


<input type="text"
class="form-control"
placeholder="Enter Worker Name">


</div>







<!-- Mobile -->

<div class="col-md-6">


<label>
Mobile Number
</label>


<input type="number"
class="form-control"
placeholder="Enter Mobile Number">


</div>







<!-- Work Type -->

<div class="col-md-6">


<label>
Work Type
</label>


<select class="form-control">


<option>
Select Work
</option>


<option>
Labour
</option>


<option>
Driver
</option>


<option>
Helper
</option>


<option>
Machine Operator
</option>


</select>


</div>








<!-- Salary -->


<div class="col-md-6">


<label>
Monthly Salary
</label>


<input type="number"
class="form-control"
placeholder="Enter Salary">


</div>








<!-- Joining Date -->


<div class="col-md-6">


<label>
Joining Date
</label>


<input type="date"
class="form-control">


</div>








<!-- Status -->

<div class="col-md-6">


<label>
Status
</label>


<select class="form-control">


<option>
Active
</option>


<option>
Inactive
</option>


</select>


</div>







<!-- Address -->

<div class="col-md-12">


<label>
Address
</label>


<textarea class="form-control"
rows="4"
placeholder="Enter Address"></textarea>


</div>



</div>







<button class="btn btn-success mt-4">


<i class="bi bi-save"></i>

Save Worker


</button>



</form>



</div>



</div>



</div>



</div>




</body>

</html>
