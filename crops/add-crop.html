<!-- ================= Main Content ================= -->


<div class="main-content">



<div class="topbar">


<h2>

Add New Crop

</h2>




<div class="top-right">


<div class="notification">


<i class="bi bi-bell-fill"></i>


<span class="badge-count">

3

</span>


</div>




<div class="user-info">


<img src="../images/profile.jpg">


<b>

Shubham

</b>


</div>


</div>


</div>




<div class="content">
    <!-- ================= Add Crop Form ================= -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-body p-4">



<h4 class="mb-4">

<i class="bi bi-tree-fill text-success"></i>

Crop Information

</h4>




<form id="cropForm">



<div class="row">





<!-- Crop ID -->


<div class="col-md-6 mb-3">


<label class="form-label">

Crop ID

</label>


<input

type="text"

class="form-control"

placeholder="Example C005"

required>


</div>







<!-- Crop Name -->


<div class="col-md-6 mb-3">


<label class="form-label">

Crop Name

</label>


<input

type="text"

class="form-control"

placeholder="Enter Crop Name"

required>


</div>







<!-- Seed Type -->


<div class="col-md-6 mb-3">


<label class="form-label">

Seed Type

</label>


<input

type="text"

class="form-control"

placeholder="Example: HD Wheat Seed">


</div>







<!-- Select Land -->


<div class="col-md-6 mb-3">


<label class="form-label">

Select Land

</label>


<select class="form-select">


<option selected disabled>

Choose Land

</option>


<option>

L001 - 5 Acres

</option>


<option>

L002 - 8 Acres

</option>


<option>

L003 - 12 Acres

</option>


<option>

L004 - 3 Acres

</option>


</select>


</div>








<!-- Sowing Date -->


<div class="col-md-6 mb-3">


<label class="form-label">

Sowing Date

</label>


<input

type="date"

class="form-control">


</div>







<!-- Harvest Date -->


<div class="col-md-6 mb-3">


<label class="form-label">

Expected Harvest Date

</label>


<input

type="date"

class="form-control">


</div>








<!-- Fertilizer Used -->


<div class="col-md-6 mb-3">


<label class="form-label">

Fertilizer Used

</label>


<select class="form-select">


<option>

Select Fertilizer

</option>


<option>

Urea

</option>


<option>

DAP

</option>


<option>

Potash

</option>


<option>

Organic Compost

</option>


</select>


</div>








<!-- Irrigation Type -->


<div class="col-md-6 mb-3">


<label class="form-label">

Irrigation Type

</label>


<select class="form-select">


<option>

Select Irrigation

</option>


<option>

Drip Irrigation

</option>


<option>

Sprinkler

</option>


<option>

Canal

</option>


<option>

Rain Water

</option>


</select>


</div>







<!-- Total Cost -->


<div class="col-md-6 mb-3">


<label class="form-label">

Total Cost ($)

</label>


<input

type="number"

class="form-control"

placeholder="Enter Total Cost">


</div>








<!-- Expected Profit -->


<div class="col-md-6 mb-3">


<label class="form-label">

Expected Profit ($)

</label>


<input

type="number"

class="form-control"

placeholder="Enter Expected Profit">


</div>








<!-- Crop Image -->


<div class="col-md-12 mb-3">


<label class="form-label">

Upload Crop Image

</label>


<input

type="file"

class="form-control"

accept="image/*">


</div>







<!-- Crop Description -->


<div class="col-md-12 mb-3">


<label class="form-label">

Crop Description

</label>


<textarea

class="form-control"

rows="4"

placeholder="Enter crop details">

</textarea>


</div>
<!-- ================= Buttons ================= -->


<div class="mt-4 text-end">


<a href="crop-list.html"

class="btn btn-secondary me-2">


<i class="bi bi-arrow-left"></i>


Back


</a>





<button

type="reset"

class="btn btn-warning me-2">


<i class="bi bi-arrow-clockwise"></i>


Reset


</button>






<button

type="submit"

class="btn btn-success">


<i class="bi bi-save-fill"></i>


Save Crop


</button>



</div>




</form>



</div>


</div>

<script>


// ===============================
// Add Crop Submit
// ===============================


document

.getElementById("cropForm")

.addEventListener("submit",function(e){



e.preventDefault();




alert("✅ Crop Added Successfully!");




this.reset();



});



</script>
