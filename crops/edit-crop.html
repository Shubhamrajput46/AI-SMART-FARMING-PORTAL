<div class="content">
    <!-- ================= Edit Crop Form ================= -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-body p-4">



<h4 class="mb-4">

<i class="bi bi-pencil-square text-success"></i>

Update Crop Information

</h4>




<form id="editCropForm">



<div class="row">





<!-- Crop ID -->

<div class="col-md-6 mb-3">


<label class="form-label">

Crop ID

</label>


<input

type="text"

class="form-control"

value="C001"

readonly>


</div>







<!-- Crop Name -->

<div class="col-md-6 mb-3">


<label class="form-label">

Crop Name

</label>


<input

type="text"

class="form-control"

value="Wheat">


</div>








<!-- Seed Type -->

<div class="col-md-6 mb-3">


<label class="form-label">

Seed Type

</label>


<input

type="text"

class="form-control"

value="HD Wheat Seed">


</div>







<!-- Select Land -->

<div class="col-md-6 mb-3">


<label class="form-label">

Select Land

</label>


<select class="form-select">


<option selected>

L001 - 5 Acres

</option>


<option>

L002 - 8 Acres

</option>


<option>

L003 - 12 Acres

</option>


<option>

L004 - 3 Acres

</option>


</select>


</div>








<!-- Sowing Date -->

<div class="col-md-6 mb-3">


<label class="form-label">

Sowing Date

</label>


<input

type="date"

class="form-control"

value="2026-11-10">


</div>







<!-- Harvest Date -->

<div class="col-md-6 mb-3">


<label class="form-label">

Harvest Date

</label>


<input

type="date"

class="form-control"

value="2027-03-15">


</div>








<!-- Fertilizer -->

<div class="col-md-6 mb-3">


<label class="form-label">

Fertilizer Used

</label>



<select class="form-select">


<option selected>

Urea

</option>


<option>

DAP

</option>


<option>

Potash

</option>


<option>

Organic Compost

</option>


</select>


</div>








<!-- Irrigation -->

<div class="col-md-6 mb-3">


<label class="form-label">

Irrigation Type

</label>



<select class="form-select">


<option selected>

Drip Irrigation

</option>


<option>

Sprinkler

</option>


<option>

Canal

</option>


<option>

Rain Water

</option>


</select>


</div>








<!-- Cost -->

<div class="col-md-6 mb-3">


<label class="form-label">

Total Cost

</label>


<input

type="number"

class="form-control"

value="500">


</div>








<!-- Profit -->

<div class="col-md-6 mb-3">


<label class="form-label">

Expected Profit

</label>


<input

type="number"

class="form-control"

value="1200">


</div>








<!-- Status -->

<div class="col-md-6 mb-3">


<label class="form-label">

Crop Status

</label>



<select class="form-select">


<option selected>

Growing

</option>


<option>

Harvest Ready

</option>


<option>

Completed

</option>


<option>

Failed

</option>


</select>



</div>








<!-- Crop Image -->


<div class="col-md-6 mb-3">


<label class="form-label">

Update Crop Image

</label>


<input

type="file"

class="form-control"

accept="image/*">


</div>








<!-- Description -->

<div class="col-md-12 mb-3">


<label class="form-label">

Crop Description

</label>


<textarea

class="form-control"

rows="4">


Wheat crop planted in 5 acres land.


</textarea>


</div>
<!-- ================= Buttons ================= -->

<a href="crop-list.html"

Back


</a>

type="button"

class="btn btn-danger me-2"

onclick="deleteCrop()">



<i class="bi bi-trash-fill"></i>


Delete Crop


</button>








<button

type="submit"

class="btn btn-success">


<i class="bi bi-check-circle-fill"></i>


Update Crop


</button>

<script>



// ===============================
// Update Crop
// ===============================


document

.getElementById("editCropForm")

.addEventListener("submit",function(e){



e.preventDefault();



alert("✅ Crop Updated Successfully!");



});







// ===============================
// Delete Crop
// ===============================


function deleteCrop(){



let confirmDelete = confirm(

"Are you sure you want to delete this crop?"

);




if(confirmDelete){



alert("🗑 Crop Deleted Successfully!");



window.location.href="crop-list.html";



}



}



</script>
