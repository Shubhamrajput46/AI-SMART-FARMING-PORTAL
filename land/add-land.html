<!-- ================= Main Content ================= -->


<div class="main-content">



<div class="topbar">


<h2>

Add New Land

</h2>



<div class="top-right">


<div class="notification">


<i class="bi bi-bell-fill"></i>


<span class="badge-count">

3

</span>


</div>




<div class="user-info">


<img src="../images/profile.jpg">


<b>

Shubham

</b>


</div>


</div>


</div>



<div class="content">
    <!-- ================= Add Land Form ================= -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-body p-4">



<h4 class="mb-4">

<i class="bi bi-map-fill text-success"></i>

Land Information

</h4>




<form id="landForm">



<div class="row">



<!-- Land ID -->

<div class="col-md-6 mb-3">


<label class="form-label">

Land ID

</label>


<input 
type="text"
class="form-control"
placeholder="Enter Land ID (Example L005)"
required>


</div>





<!-- Land Area -->

<div class="col-md-6 mb-3">


<label class="form-label">

Area (Acres)

</label>


<input 
type="number"
class="form-control"
placeholder="Enter Land Area"
required>


</div>





<!-- Soil Type -->

<div class="col-md-6 mb-3">


<label class="form-label">

Soil Type

</label>


<select class="form-select">


<option selected disabled>

Select Soil Type

</option>


<option>

Black Soil

</option>


<option>

Red Soil

</option>


<option>

Clay Soil

</option>


<option>

Sandy Soil

</option>


<option>

Loamy Soil

</option>


</select>


</div>






<!-- Water Source -->

<div class="col-md-6 mb-3">


<label class="form-label">

Water Source

</label>


<select class="form-select">


<option selected disabled>

Select Water Source

</option>


<option>

Borewell

</option>


<option>

Canal

</option>


<option>

River

</option>


<option>

Rain Water

</option>


<option>

Drip Irrigation

</option>


</select>


</div>






<!-- Village -->

<div class="col-md-6 mb-3">


<label class="form-label">

Village

</label>


<input 
type="text"
class="form-control"
placeholder="Enter Village Name">


</div>






<!-- District -->

<div class="col-md-6 mb-3">


<label class="form-label">

District

</label>


<input 
type="text"
class="form-control"
placeholder="Enter District">


</div>







<!-- State -->

<div class="col-md-6 mb-3">


<label class="form-label">

State

</label>


<input 
type="text"
class="form-control"
placeholder="Enter State">


</div>







<!-- GPS -->

<div class="col-md-6 mb-3">


<label class="form-label">

GPS Coordinates

</label>


<input 
type="text"
class="form-control"
placeholder="Example: 22.7196,75.8577">


</div>








<!-- Land Photo -->


<div class="col-md-12 mb-3">


<label class="form-label">

Upload Land Photo

</label>


<input 

type="file"

class="form-control"

accept="image/*">


</div>





<!-- Description -->


<div class="col-md-12 mb-3">


<label class="form-label">

Description

</label>


<textarea

class="form-control"

rows="4"

placeholder="Enter land details">

</textarea>


</div>


<!-- ================= Buttons ================= -->


<div class="mt-4 text-end">


<a href="land-list.html" 
class="btn btn-secondary me-2">

<i class="bi bi-arrow-left"></i>

Back

</a>




<button 
type="reset"

class="btn btn-warning me-2">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>





<button 

type="submit"

class="btn btn-success">

<i class="bi bi-save-fill"></i>

Save Land

</button>



</div>



</form>


</div>

</div>



</div>

</div>

<script>


// ===============================
// Land Form Submit
// ===============================


document.getElementById("landForm")
.addEventListener("submit",function(e){



e.preventDefault();



alert("✅ Land Added Successfully!");



this.reset();



});



</script>
