<div class="content">
    <!-- ================= Edit Land Form ================= -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-body p-4">



<h4 class="mb-4">

<i class="bi bi-pencil-square text-success"></i>

Update Land Information

</h4>




<form id="editLandForm">



<div class="row">





<!-- Land ID -->

<div class="col-md-6 mb-3">


<label class="form-label">

Land ID

</label>


<input 

type="text"

class="form-control"

value="L001"

readonly>


</div>





<!-- Area -->

<div class="col-md-6 mb-3">


<label class="form-label">

Area (Acres)

</label>


<input 

type="number"

class="form-control"

value="5">


</div>





<!-- Soil Type -->

<div class="col-md-6 mb-3">


<label class="form-label">

Soil Type

</label>



<select class="form-select">


<option>

Black Soil

</option>


<option>

Red Soil

</option>


<option>

Clay Soil

</option>


<option>

Sandy Soil

</option>


<option>

Loamy Soil

</option>



</select>


</div>






<!-- Water Source -->


<div class="col-md-6 mb-3">


<label class="form-label">

Water Source

</label>



<select class="form-select">


<option>

Borewell

</option>


<option>

Canal

</option>


<option>

River

</option>


<option>

Rain Water

</option>


<option>

Drip Irrigation

</option>


</select>



</div>








<!-- Village -->


<div class="col-md-6 mb-3">


<label class="form-label">

Village

</label>


<input

type="text"

class="form-control"

value="Indore">


</div>








<!-- District -->


<div class="col-md-6 mb-3">


<label class="form-label">

District

</label>


<input

type="text"

class="form-control"

value="Indore">


</div>








<!-- State -->


<div class="col-md-6 mb-3">


<label class="form-label">

State

</label>


<input

type="text"

class="form-control"

value="Madhya Pradesh">


</div>








<!-- GPS -->


<div class="col-md-6 mb-3">


<label class="form-label">

GPS Coordinates

</label>


<input

type="text"

class="form-control"

value="22.7196,75.8577">


</div>








<!-- Upload Photo -->


<div class="col-md-12 mb-3">


<label class="form-label">

Update Land Photo

</label>


<input

type="file"

class="form-control"

accept="image/*">


</div>







<!-- Description -->


<div class="col-md-12 mb-3">


<label class="form-label">

Description

</label>



<textarea

class="form-control"

rows="4">

5 Acre farmland located in Indore area.

</textarea>



</div>
<!-- ================= Buttons ================= -->


<div class="mt-4 text-end">



<a href="land-list.html"

class="btn btn-secondary me-2">


<i class="bi bi-arrow-left"></i>

Back


</a>





<button

type="button"

class="btn btn-danger me-2"

onclick="deleteLand()">


<i class="bi bi-trash-fill"></i>

Delete


</button>






<button

type="submit"

class="btn btn-success">


<i class="bi bi-check-circle-fill"></i>

Update Land


</button>

<script>


// ================================
// Update Land
// ================================


document.getElementById("editLandForm")

.addEventListener("submit",function(e){


e.preventDefault();


alert("✅ Land Updated Successfully!");



});






// ================================
// Delete Land
// ================================


function deleteLand(){



let confirmDelete = confirm(

"Are you sure you want to delete this land?"

);



if(confirmDelete){


alert("🗑 Land Deleted Successfully!");



window.location.href="land-list.html";


}



}



</script>
