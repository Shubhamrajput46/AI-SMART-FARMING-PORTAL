<div class="content">
    <!-- ================= Add Fertilizer Form ================= -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-body p-4">



<h4 class="mb-4">

<i class="bi bi-droplet-fill text-success"></i>

Fertilizer Information

</h4>




<form id="fertilizerForm">



<div class="row">





<!-- Fertilizer ID -->


<div class="col-md-6 mb-3">


<label class="form-label">

Fertilizer ID

</label>


<input

type="text"

class="form-control"

placeholder="Example F005"

required>


</div>







<!-- Fertilizer Name -->


<div class="col-md-6 mb-3">


<label class="form-label">

Fertilizer Name

</label>


<input

type="text"

class="form-control"

placeholder="Enter Fertilizer Name"

required>


</div>








<!-- Fertilizer Type -->


<div class="col-md-6 mb-3">


<label class="form-label">

Fertilizer Type

</label>


<select class="form-select">


<option selected disabled>

Select Type

</option>


<option>

Organic

</option>


<option>

Chemical

</option>


</select>


</div>








<!-- Quantity -->


<div class="col-md-6 mb-3">


<label class="form-label">

Quantity (Kg)

</label>


<input

type="number"

class="form-control"

placeholder="Enter Quantity">


</div>








<!-- Price -->


<div class="col-md-6 mb-3">


<label class="form-label">

Price ($)

</label>


<input

type="number"

class="form-control"

placeholder="Enter Price">


</div>








<!-- Applied Crop -->


<div class="col-md-6 mb-3">


<label class="form-label">

Applied Crop

</label>


<select class="form-select">


<option selected disabled>

Select Crop

</option>


<option>

Wheat 🌾

</option>


<option>

Soybean 🌱

</option>


<option>

Rice 🌾

</option>


<option>

Cotton 🌱

</option>


</select>


</div>








<!-- Application Date -->


<div class="col-md-6 mb-3">


<label class="form-label">

Application Date

</label>


<input

type="date"

class="form-control">


</div>








<!-- Expiry Date -->


<div class="col-md-6 mb-3">


<label class="form-label">

Expiry Date

</label>


<input

type="date"

class="form-control">


</div>








<!-- Supplier Name -->


<div class="col-md-6 mb-3">


<label class="form-label">

Supplier Name

</label>


<input

type="text"

class="form-control"

placeholder="Enter Supplier Name">


</div>








<!-- Stock Status -->


<div class="col-md-6 mb-3">


<label class="form-label">

Stock Status

</label>


<select class="form-select">


<option>

Available

</option>


<option>

Low Stock

</option>


<option>

Out of Stock

</option>


</select>


</div>








<!-- Fertilizer Image -->


<div class="col-md-6 mb-3">


<label class="form-label">

Upload Fertilizer Image

</label>


<input

type="file"

class="form-control"

accept="image/*">


</div>








<!-- Description -->


<div class="col-md-12 mb-3">


<label class="form-label">

Description

</label>


<textarea

class="form-control"

rows="4"

placeholder="Enter fertilizer details">

</textarea>


</div>
<!-- ================= Buttons ================= -->


<div class="mt-4 text-end">


<a href="fertilizer-list.html"

class="btn btn-secondary me-2">


<i class="bi bi-arrow-left"></i>

Back


</a>






<button

type="reset"

class="btn btn-warning me-2">


<i class="bi bi-arrow-clockwise"></i>

Reset


</button>







<button

type="submit"

class="btn btn-success">


<i class="bi bi-save-fill"></i>

Save Fertilizer


</button>

.addEventListener("submit",function(e){

});
