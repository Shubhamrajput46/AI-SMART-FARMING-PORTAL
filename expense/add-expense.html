<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<link rel="stylesheet" href="../css/expense.css">


</head>


<body>


<div class="dashboard-container">



<!-- Sidebar -->


<div class="sidebar">


<div class="logo">

🌾 AI Smart<br>
Farming

</div>



<ul>


<li>

<i class="bi bi-grid-fill"></i>
Dashboard

</li>



<li>

<i class="bi bi-person-circle"></i>
Profile

</li>



<li>

<i class="bi bi-map"></i>
Land

</li>



<li>

<i class="bi bi-tree-fill"></i>
Crops

</li>



<li class="active">

<i class="bi bi-wallet-fill"></i>
Expenses

</li>



<li>

<i class="bi bi-people-fill"></i>
Workers

</li>



<li>

<i class="bi bi-cart-fill"></i>
Sales

</li>



</ul>


</div>





<!-- Main -->


<div class="main-content">



<!-- Navbar -->


<div class="topbar">


<h2>

➕ Add Expense

</h2>



<div>

🔔

<b>
Welcome, Shubham
</b>

👤

</div>


</div>







<div class="content">



<div class="form-card">



<h3>

Add New Expense

</h3>





<form>



<div class="row g-4">



<!-- Category -->

<div class="col-md-6">


<label>

Expense Category

</label>


<select class="form-control">


<option>
Select Category
</option>


<option>
Fertilizer
</option>


<option>
Seeds
</option>


<option>
Labour
</option>


<option>
Equipment
</option>


</select>


</div>






<!-- Crop -->


<div class="col-md-6">


<label>

Crop

</label>


<select class="form-control">


<option>
Select Crop
</option>


<option>
Wheat
</option>


<option>
Soybean
</option>


<option>
Corn
</option>


</select>


</div>







<!-- Amount -->


<div class="col-md-6">


<label>

Amount

</label>


<input type="number"
class="form-control"
placeholder="Enter Amount">


</div>








<!-- Date -->


<div class="col-md-6">


<label>

Date

</label>


<input type="date"
class="form-control">


</div>







<!-- Payment -->


<div class="col-md-6">


<label>

Payment Status

</label>


<select class="form-control">


<option>
Paid
</option>


<option>
Pending
</option>


</select>


</div>






<!-- Description -->


<div class="col-md-12">


<label>

Description

</label>


<textarea class="form-control"
rows="4"
placeholder="Expense details..."></textarea>


</div>



</div>





<button class="btn btn-success mt-4">


<i class="bi bi-save"></i>

Save Expense


</button>



</form>




</div>




</div>



</div>



</div>



</body>

</html>
