<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Fertilizer Recommendation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="../css/ai.css">

</head>

<body>

<div class="container py-5">

<h2 class="page-title">

🧪 AI Fertilizer Recommendation

</h2>

<div class="row">

<div class="col-lg-6">

<div class="ai-card">

<h4>Enter Farm Details</h4>

<hr>

<div class="mb-3">

<label class="form-label">Soil Type</label>

<select class="form-select" id="soil">

<option>Black Soil</option>

<option>Red Soil</option>

<option>Clay Soil</option>

<option>Sandy Soil</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Nitrogen (N)</label>

<input type="number" class="form-control" id="nitrogen">

</div>

<div class="mb-3">

<label class="form-label">Phosphorus (P)</label>

<input type="number" class="form-control" id="phosphorus">

</div>

<div class="mb-3">

<label class="form-label">Potassium (K)</label>

<input type="number" class="form-control" id="potassium">

</div>

<div class="mb-3">

<label class="form-label">Temperature</label>

<input type="number" class="form-control" id="temperature">

</div>

<button class="ai-btn w-100" onclick="recommendFertilizer()">

Generate AI Recommendation

</button>

</div>

</div>

<div class="col-lg-6">

<div class="ai-card">

<h4>🤖 AI Result</h4>

<hr>

<div id="result">

<p class="text-muted">

Enter the details and click the button.

</p>

</div>

</div>

</div>

</div>

</div>

<script src="../js/ai.js"></script>

</body>

</html>
