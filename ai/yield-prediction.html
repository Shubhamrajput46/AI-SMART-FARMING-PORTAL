<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Yield Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="../css/ai.css">

</head>

<body>

<div class="container py-5">

<h2 class="page-title">

📈 AI Yield Prediction

</h2>

<div class="row">

<!-- Left -->

<div class="col-lg-6">

<div class="ai-card">

<h4>Enter Crop Details</h4>

<hr>

<div class="mb-3">

<label>Crop Name</label>

<select class="form-select" id="crop">

<option>Wheat</option>

<option>Rice</option>

<option>Soybean</option>

<option>Cotton</option>

<option>Maize</option>

</select>

</div>

<div class="mb-3">

<label>Land Area (Acres)</label>

<input
type="number"
class="form-control"
id="landArea">

</div>

<div class="mb-3">

<label>Irrigation Type</label>

<select class="form-select" id="irrigation">

<option>Drip</option>

<option>Canal</option>

<option>Rain Water</option>

<option>Sprinkler</option>

</select>

</div>

<div class="mb-3">

<label>Weather</label>

<select class="form-select" id="weather">

<option>Sunny</option>

<option>Cloudy</option>

<option>Rainy</option>

</select>

</div>

<div class="mb-3">

<label>Fertilizer Used</label>

<select class="form-select" id="fertilizer">

<option>Urea</option>

<option>DAP</option>

<option>Organic</option>

<option>Potash</option>

</select>

</div>

<button
class="ai-btn w-100"
onclick="predictYield()">

Predict Yield

</button>

</div>

</div>

<!-- Right -->

<div class="col-lg-6">

<div class="ai-card">

<h4>🤖 Prediction Result</h4>

<hr>

<div id="yieldResult">

<p class="text-muted">

Prediction will appear here.

</p>

</div>

</div>

</div>

</div>

</div>

<script src="../js/ai.js"></script>

</body>

</html>
