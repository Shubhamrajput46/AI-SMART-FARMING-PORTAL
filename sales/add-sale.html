<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Sale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/sales.css">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            🌾 AI Smart<br>Farming
        </div>

        <ul>

            <li>
                <a href="../dashboard.html">
                    <i class="bi bi-grid-fill"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="../expense/expense-list.html">
                    <i class="bi bi-wallet-fill"></i>
                    Expenses
                </a>
            </li>

            <li>
                <a href="../workers/worker-list.html">
                    <i class="bi bi-people-fill"></i>
                    Workers
                </a>
            </li>

            <li class="active">
                <a href="sales-list.html">
                    <i class="bi bi-cart-fill"></i>
                    Sales
                </a>
            </li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main-content">

        <div class="topbar">

            <h2>➕ Add Sale</h2>

            <div>
                🔔
                <b>Welcome, Shubham</b>
                👤
            </div>

        </div>

        <div class="content">

            <div class="form-card">

                <h3>Add New Sale</h3>

                <form>

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label>Crop Name</label>
                            <select class="form-control">
                                <option>Select Crop</option>
                                <option>Wheat</option>
                                <option>Soybean</option>
                                <option>Corn</option>
                                <option>Rice</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label>Buyer Name</label>
                            <input type="text" class="form-control" placeholder="Buyer Name">
                        </div>

                        <div class="col-md-6">
                            <label>Quantity (Quintal)</label>
                            <input type="number" class="form-control" placeholder="Enter Quantity">
                        </div>

                        <div class="col-md-6">
                            <label>Rate (₹)</label>
                            <input type="number" class="form-control" placeholder="Rate per Quintal">
                        </div>

                        <div class="col-md-6">
                            <label>Total Amount</label>
                            <input type="number" class="form-control" placeholder="Total Amount">
                        </div>

                        <div class="col-md-6">
                            <label>Sale Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Payment Status</label>
                            <select class="form-control">
                                <option>Paid</option>
                                <option>Pending</option>
                            </select>
                        </div>

                        <div class="col-md-12">
                            <label>Description</label>
                            <textarea class="form-control" rows="4"
                                placeholder="Write sale details..."></textarea>
                        </div>

                    </div>

                    <button class="btn btn-success mt-4">
                        <i class="bi bi-save"></i>
                        Save Sale
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
